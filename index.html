<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Generate weighted dinner ideas, schedule seven meals, and carry uneaten dinners into next week."
    />
    <title>Weekly Menu</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Dinner, decided</p>
        <h1>Weekly Menu</h1>
        <p class="intro">
          Roll ten dinner ideas, remove three, schedule the remaining seven, and carry anything
          you do not get to into next week.
        </p>
      </header>

      <section class="menu-card" aria-labelledby="menu-heading">
        <div class="menu-heading-row">
          <div>
            <p id="step-label" class="step-label">This week’s candidates</p>
            <h2 id="menu-heading">Choose seven dinners</h2>
          </div>

          <div class="action-row">
            <button id="secondary-button" class="action-button secondary-button" type="button" hidden>
              Clear removals
            </button>
            <button id="primary-button" class="action-button primary-button" type="button">
              Roll 10 new ideas
            </button>
          </div>
        </div>

        <p id="selection-status" class="selection-status" aria-live="polite"></p>
        <ol id="menu-list" class="menu-list" aria-live="polite"></ol>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
