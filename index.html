<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plan each day of the week, generate weighted dinner ideas, schedule quick and guest-friendly meals, and carry uneaten dinners forward."
    />
    <title>Weekly Menu</title>
    <link rel="stylesheet" href="./styles.css?v=0.22.0" />
    <link rel="stylesheet" href="./planner.css?v=0.22.0" />
    <link rel="stylesheet" href="./visual.css?v=0.22.0" />
  </head>
  <body>
    <main class="app-shell">
      <nav class="app-nav" aria-label="Primary navigation">
        <a class="app-nav-brand" href="./">Weekly Menu</a>
        <div class="app-nav-links">
          <a class="app-nav-link is-active" href="./" aria-current="page">Planner</a>
          <a class="app-nav-link" href="./history.html">History</a>
          <a class="app-nav-link" href="./manage.html">Manage</a>
        </div>
      </nav>

      <header class="hero">
        <p class="eyebrow">Dinner, decided</p>
        <h1>Weekly Menu</h1>
        <p class="intro">
          Plan the shape of your week, roll dinner ideas for the days you are cooking, and let
          quick meals, guest nights, and carryovers land where they fit best.
        </p>
        <p id="active-list-summary" class="selection-status" hidden></p>
      </header>

      <section class="menu-card" aria-labelledby="menu-heading">
        <div class="menu-heading-row">
          <div>
            <p id="step-label" class="step-label">Plan the week</p>
            <h2 id="menu-heading">What does each day need?</h2>
          </div>

          <div class="action-row">
            <button id="print-button" class="action-button secondary-button" type="button" hidden>
              Print week
            </button>
            <button id="tertiary-button" class="action-button secondary-button" type="button" hidden>
              Edit week setup
            </button>
            <button id="secondary-button" class="action-button secondary-button" type="button" hidden>
              Clear removals
            </button>
            <button id="primary-button" class="action-button primary-button" type="button">
              Generate dinner ideas
            </button>
          </div>
        </div>

        <p id="selection-status" class="selection-status" aria-live="polite"></p>
        <ol id="menu-list" class="week-setup-list" aria-live="polite"></ol>
      </section>
    </main>

    <script type="module" src="./src/bootstrap.js?v=0.21.0"></script>
    <script type="module" src="./src/archive-next-week.js?v=0.21.0"></script>
    <script type="module" src="./src/meal-chooser-search.js?v=0.19.0"></script>
    <script type="module" src="./src/print.js?v=0.17.0"></script>
  </body>
</html>
